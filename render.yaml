# Render.com blueprint: free web service for the chatbot backend.
# Set OPENAI_API_KEY in the Render dashboard (Environment > Secret); it is not stored here.
services:
  - type: web
    name: cmti-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALLOWED_ORIGINS
        value: https://dheerajsa20.github.io
