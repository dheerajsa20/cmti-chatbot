# Render's free plan puts the backend to sleep after 15 minutes without visitors, and waking it takes
# about a minute. This pings the health endpoint every 10 minutes so the chatbot stays awake.
# GitHub runs scheduled jobs on a best-effort basis (sometimes a few minutes late) and pauses them after
# 60 days without any commit to this repository; re-enable it from the Actions tab if that happens.
name: Keep chatbot awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://cmti-chatbot.onrender.com/api/health
